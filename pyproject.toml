[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "screengraph-os"
version = "0.1.0"
description = "Zero-screenshot spatio-temporal desktop memory and cross-app causal graph engine (MCP + CLI)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pydantic>=2.5",
  "typer>=0.12",
  "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
macos = ["pyobjc-framework-Quartz>=10", "pyobjc-framework-ApplicationServices>=10"]  # optional; live capture uses ctypes
clip = ["open_clip_torch>=2.24", "torch>=2.2", "pillow>=10"]  # optional learned VisionAdapter

[project.scripts]
screengraph = "screengraph.interfaces.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
