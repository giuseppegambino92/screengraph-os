[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "screengraph-os"
version = "0.1.0"
description = "Zero-screenshot spatio-temporal desktop memory and cross-app causal graph engine (MCP + CLI)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Giuseppe Gambino" }]
keywords = ["mcp", "desktop-memory", "causal-graph", "hawkes-process", "privacy", "local-first"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pydantic>=2.5",
  "typer>=0.12",
  "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
macos = ["pyobjc-framework-Quartz>=10", "pyobjc-framework-ApplicationServices>=10"]  # optional; live capture uses ctypes
clip = ["open_clip_torch>=2.24", "torch>=2.2", "pillow>=10"]  # optional learned VisionAdapter

[project.urls]
Homepage = "https://github.com/giuseppegambino92/screengraph-os"
Repository = "https://github.com/giuseppegambino92/screengraph-os"
Issues = "https://github.com/giuseppegambino92/screengraph-os/issues"

[project.scripts]
screengraph = "screengraph.interfaces.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
